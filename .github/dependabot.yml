# Weekly, grouped updates for the dev toolchain (PHPUnit, PHPStan,
# php-cs-fixer) and the workflow actions. The merged PRs are also what
# keep the scheduled CI run alive: GitHub disables schedules in public
# repos after 60 days without activity.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]
